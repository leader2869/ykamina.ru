name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Claim release before the legacy timer
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          script="/tmp/ykamina-claim-release"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes deploy/server-claim-release.sh "$DEPLOY_USER@$DEPLOY_HOST:$script"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 700 '$script'; '$script' '${GITHUB_SHA}'"

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:images
      - run: npm run build
      - name: Package verified release
        working-directory: .
        run: |
          tar --exclude=.git --exclude=frontend/node_modules --exclude=frontend/.env.local -czf "$RUNNER_TEMP/release.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: ${{ runner.temp }}/release.tgz
          retention-days: 1

  deploy:
    needs: [claim, verify]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ykamina.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: production-release
          path: artifacts
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PUBLIC_HOST: ${{ secrets.DATABASE_PUBLIC_HOST }}
          DATABASE_SSL_REJECT_UNAUTHORIZED: ${{ secrets.DATABASE_SSL_REJECT_UNAUTHORIZED }}
        run: |
          archive="/tmp/ykamina-${GITHUB_SHA}.tgz"
          script="/tmp/ykamina-artifact-deploy"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "production-release") | .id')"
          download_url="$(curl --fail --silent --show-error --dump-header - --output /dev/null \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            | sed -n 's/^[Ll]ocation: //p' | tr -d '\r')"
          test -n "$download_url"
          echo "::add-mask::$download_url"
          archive_hash="$(sha256sum artifacts/release.tgz | cut -d ' ' -f 1)"
          # Send only the short-lived URL over SSH. The server fetches the public
          # build artifact from storage, avoiding the slow SSH upload path.
          printf '%s\n' "$download_url" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; IFS= read -r download_url; curl --fail --silent --show-error --location --max-time 300 \"\$download_url\" -o '${archive}.zip'; unzip -p '${archive}.zip' release.tgz > '$archive'; printf '%s  %s\\n' '$archive_hash' '$archive' | sha256sum --check; unlink '${archive}.zip'"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes deploy/server-artifact-deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$script"
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'DATABASE_PUBLIC_HOST=%s\n' "$DATABASE_PUBLIC_HOST"
            printf 'DATABASE_SSL_REJECT_UNAUTHORIZED=%s\n' "$DATABASE_SSL_REJECT_UNAUTHORIZED"
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 700 '$script'; '$script' '${GITHUB_SHA}' '$archive'"
