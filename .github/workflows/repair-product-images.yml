name: Repair production product images

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Repair images or inspect server health without changing data
        type: choice
        options: [repair, diagnose]
        default: repair

concurrency:
  group: production-image-${{ inputs.mode || 'repair' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - uses: actions/checkout@v4
        if: inputs.mode != 'diagnose'
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Inspect server and deployment health
        if: inputs.mode == 'diagnose'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          dd if=/dev/urandom of="$RUNNER_TEMP/transfer-probe" bs=65536 count=1 status=none
          time scp -O -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$RUNNER_TEMP/transfer-probe" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/ykamina-transfer-probe-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'uptime; free -m; df -h /srv/ykamina; readlink -f /srv/ykamina/current; ps -eo pid,comm,etimes,pcpu,pmem --sort=-pcpu | head -15; systemctl is-active ykamina.service; find /srv/ykamina -maxdepth 1 -type d -name ".staging-*" -exec du -sh {} \;; find /tmp -maxdepth 1 -type f -name "ykamina-*.tgz" -printf "%f %s bytes\n"; find /srv/ykamina/shared/image-repair -maxdepth 1 -name "*-report.json" -exec tail -c 500 {} \;'
      - name: Restore verified supplier images with a rollback snapshot
        if: inputs.mode != 'diagnose'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          tar -czf "$RUNNER_TEMP/image-repair.tgz" frontend/scripts
          archive="/tmp/ykamina-image-repair-${GITHUB_SHA}.tgz"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$RUNNER_TEMP/image-repair.tgz" "$DEPLOY_USER@$DEPLOY_HOST:$archive"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes deploy/server-run-image-repair.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/ykamina-run-image-repair"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /tmp/ykamina-run-image-repair '${GITHUB_SHA}'"
      - name: Reload public file inventory and check the catalog
        if: always() && inputs.mode != 'diagnose'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo systemctl restart ykamina.service && for attempt in $(seq 1 20); do if curl --fail --silent --max-time 10 http://127.0.0.1:3000/api/products >/dev/null; then exit 0; fi; sleep 2; done; exit 1'
      - name: Download repair reports
        if: always() && inputs.mode != 'diagnose'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p reports
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST:/srv/ykamina/shared/image-repair/*-report.json" reports/
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode != 'diagnose'
        with:
          name: image-repair-reports
          path: reports/
          retention-days: 14
